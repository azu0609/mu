org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The flake's dev shell sets android.aapt2FromMavenOverride, which AGP warns about.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# ABIs to build the Rust core for: phones, and the emulator.
mu.abis=arm64-v8a,x86_64
