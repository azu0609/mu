[workspace]
resolver = "3"
members = ["crates/*"]
# mu-ffi only builds for the Android app, through its Gradle build.
default-members = ["crates/mu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mu-client = { path = "crates/client" }
mu-host = { path = "crates/host" }
mu-tui = { path = "crates/tui" }
mu-wire = { path = "crates/wire" }
base64 = "0.23"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
libc = "0.2"
percent-encoding = "2"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
uniffi = "0.32"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The Android library unwinds, so a Rust panic reaches Kotlin as an exception
# instead of taking the app down. It keeps its symbols for uniffi-bindgen to
# read the bindings from; AGP strips it when packaging.
[profile.android]
inherits = "release"
panic = "unwind"
strip = "debuginfo"
