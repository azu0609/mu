[package]
name = "mu"
version = "0.1.0"
edition = "2024"
description = "A small coding agent: match the post-train."
license = "MIT"

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
