[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mu-client = { path = "crates/client" }
mu-core = { path = "crates/core" }
mu-proto = { path = "crates/proto" }
mu-server = { path = "crates/server" }
mu-tui = { path = "crates/tui" }
base64 = "0.23"
buffa = { version = "0.9", default-features = false, features = ["std"] }
connectrpc = { version = "0.9", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
