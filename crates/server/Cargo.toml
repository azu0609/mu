[package]
name = "mu-server"
description = "Serves mu-core sessions to clients over ConnectRPC."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mu-core.workspace = true
mu-proto.workspace = true
connectrpc.workspace = true
futures-core = "0.3"
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "signal", "time", "macros"] }
