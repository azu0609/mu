[package]
name = "mu-client"
description = "Connects to a mu host; the shared base of Rust clients."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mu-proto.workspace = true
connectrpc = { workspace = true, features = ["client"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["net"] }
tower = { version = "0.5", features = ["util"] }
