syntax = "proto3";

package mu.v1;

// One mu host: it owns the sessions, runs the agent loop and its tools, and
// reads the files. Clients only render state and send intents.
service SessionService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Starts with a snapshot, then streams changes until the client leaves.
  // A client that falls too far behind is cut off and may subscribe again.
  rpc Subscribe(SubscribeRequest) returns (stream SessionEvent);
  // Starts a step, or queues the message as steering while one is running.
  rpc Send(SendRequest) returns (SendResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  // Takes the newest queued message back for editing.
  rpc RecallQueued(RecallQueuedRequest) returns (RecallQueuedResponse);
  rpc SetModel(SetModelRequest) returns (SetModelResponse);
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  rpc Checkout(CheckoutRequest) returns (CheckoutResponse);
  // Completes the @file mention at the cursor against the host's files.
  rpc CompleteMention(CompleteMentionRequest) returns (CompleteMentionResponse);
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_IDLE = 1;
  SESSION_STATUS_RUNNING = 2;
  SESSION_STATUS_FINISHED = 3;
  SESSION_STATUS_FAILED = 4;
}

enum BlockKind {
  BLOCK_KIND_UNSPECIFIED = 0;
  BLOCK_KIND_USER = 1;
  BLOCK_KIND_AGENT = 2;
  BLOCK_KIND_THOUGHT = 3;
  BLOCK_KIND_CALL = 4;
  BLOCK_KIND_NOTICE = 5;
  BLOCK_KIND_WARNING = 6;
}

enum ToolState {
  TOOL_STATE_UNSPECIFIED = 0;
  TOOL_STATE_PENDING = 1;
  TOOL_STATE_RUNNING = 2;
  TOOL_STATE_EXITED = 3;
  TOOL_STATE_TIMED_OUT = 4;
  TOOL_STATE_CANCELLED = 5;
  TOOL_STATE_ERROR = 6;
}

message Model {
  string name = 1;
  optional string effort = 2;
  uint64 context = 3;
}

message ToolOutput {
  string text = 1;
  // Host path of the full log when the text is only a preview.
  optional string log = 2;
  bool truncated = 3;
}

message Tool {
  string call_id = 1;
  ToolState state = 2;
  // Set when exited.
  int32 exit_code = 3;
  // Set when timed out.
  uint64 timeout_ms = 4;
  ToolOutput output = 5;
}

message Block {
  BlockKind kind = 1;
  string text = 2;
  // Set for calls.
  Tool tool = 3;
}

message Skill {
  string name = 1;
  string description = 2;
}

// Token totals along the current conversation path.
message Stats {
  uint64 input = 1;
  uint64 output = 2;
  // Unset when the provider does not report cache reads.
  optional uint64 cached = 3;
  uint64 uncached_input = 4;
  // Tokens the latest response occupied in the context window.
  uint64 context_used = 5;
}

message SessionSummary {
  string id = 1;
  string title = 2;
  string cwd = 3;
  SessionStatus status = 4;
}

// The small mutable part of a session; always sent whole.
message SessionState {
  SessionStatus status = 1;
  string title = 2;
  Model model = 3;
  Stats stats = 4;
  // Messages waiting to steer the running agent, oldest first.
  repeated string queued = 5;
}

// Resets the client's view of a session. The transcript along the current
// path and the step in progress follow as ordinary commits and live events,
// so no single message grows with the session.
message Snapshot {
  string id = 1;
  string cwd = 2;
  SessionState state = 3;
  repeated Skill skills = 4;
}

message Commit {
  repeated Block blocks = 1;
}

message LiveDelta {
  uint32 index = 1;
  string text = 2;
}

message LiveSet {
  uint32 index = 1;
  Block block = 2;
}

message LiveOutput {
  uint32 index = 1;
  ToolOutput output = 2;
}

message SessionEvent {
  oneof event {
    Snapshot snapshot = 1;
    SessionState state = 2;
    // Appends to the transcript and clears the live step.
    Commit commit = 3;
    // Live blocks are indexed in push order until the next commit.
    Block live_push = 4;
    LiveDelta live_delta = 5;
    LiveSet live_set = 6;
    LiveOutput live_output = 7;
    Block live_notice = 8;
    // Transient; not part of the session and not replayed to late subscribers.
    Block feedback = 9;
  }
}

message ListSessionsRequest {}

message ListSessionsResponse {
  // Most recently used first.
  repeated SessionSummary sessions = 1;
}

message CreateSessionRequest {
  string cwd = 1;
  // Unset fields fall back to the host's defaults.
  optional string model = 2;
  // Empty for a model without reasoning effort.
  optional string effort = 3;
  optional uint64 context = 4;
}

message CreateSessionResponse {
  string id = 1;
}

message SubscribeRequest {
  string session_id = 1;
}

message SendRequest {
  string session_id = 1;
  string text = 2;
  // Name of a skill to attach, as listed in the snapshot.
  optional string skill = 3;
}

message SendResponse {}

message StopRequest {
  string session_id = 1;
}

message StopResponse {}

message RecallQueuedRequest {
  string session_id = 1;
}

message RecallQueuedResponse {
  optional string text = 1;
}

message SetModelRequest {
  string session_id = 1;
  Model model = 2;
}

message SetModelResponse {}

message GetTreeRequest {
  string session_id = 1;
}

message TreeEntry {
  // Unset for the root.
  optional uint64 node = 1;
  string label = 2;
  bool current = 3;
}

message GetTreeResponse {
  repeated TreeEntry entries = 1;
}

message CheckoutRequest {
  string session_id = 1;
  // Unset for the root.
  optional uint64 node = 2;
}

message CheckoutResponse {
  // Checking out a user message moves to its parent and returns its text for editing.
  optional string draft = 1;
}

message CompleteMentionRequest {
  string session_id = 1;
  string text = 2;
  // In characters, like the returned range.
  uint32 cursor = 3;
  // Rebuild the file index; set when a mention is first opened.
  bool refresh = 4;
}

message MentionEntry {
  // Replacement for the mention's range.
  string text = 1;
  string label = 2;
}

message Mention {
  uint32 start = 1;
  uint32 end = 2;
  string query = 3;
  // The query already names an existing file.
  bool exact = 4;
  repeated MentionEntry entries = 5;
}

message CompleteMentionResponse {
  // Unset when the cursor is not in a mention.
  Mention mention = 1;
}
